name: Publish Diwali Mix audio

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/stuvi-diwali-set-*.mp3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and assemble the uploaded mix
        run: node scripts/build-site.mjs
      - name: Publish MP3s to the Pages source branch
        run: |
          cp dist/assets/stuvi-diwali-set-*.mp3 assets/
          git add assets/stuvi-diwali-set-*.mp3
          if git diff --cached --quiet; then
            echo 'Audio is already current.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish assembled Diwali Mix audio'
          git push
